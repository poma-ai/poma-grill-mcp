name: Release Node

on:
  push:
    branches:
      - release-node

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Read package version
        id: version
        working-directory: node
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "could not read version from node/package.json" >&2
            exit 1
          fi
          TAG="node-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: $TAG)"

      - name: Check version not already published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@poma-ai/poma-grill-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already on npm. Bump node/package.json and push again."
            exit 1
          fi
          echo "Version ${VERSION} not yet on npm; proceeding."

      - name: Install dependencies
        working-directory: node
        run: npm ci

      - name: Smoke test
        working-directory: node
        run: npm run smoke

      # Trusted publishing: npm exchanges this job's GitHub OIDC token (id-token: write)
      # for a short-lived publish token, so no NPM_TOKEN secret exists to expire. The
      # exchange needs npm >= 11.5.1; Node 20 bundles npm 10, which falls back to the
      # token in .npmrc. Requires a trusted publisher in the package settings on
      # npmjs.com: repo poma-ai/poma-grill-mcp, workflow release-node.yml, no environment.
      # A missing or mismatched publisher still fails as an opaque E404 on the PUT; the
      # failed exchange is only logged at verbose level, hence --loglevel verbose.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        working-directory: node
        run: npm publish --access public --provenance --loglevel verbose

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping tag creation."
          else
            git tag -a "${TAG}" -m "Node release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
